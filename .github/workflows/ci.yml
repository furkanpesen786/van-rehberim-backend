name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint (ESLint + TypeScript)
      run: npm run lint

    # M24: unit testler (Vitest) — CI'da her push'ta koşar
    - name: Unit tests (Vitest)
      run: npm test

    - name: Build Vite app
      run: npm run build

    # M23 + M7 dersi: sunucu dist'ten ayağa kalkıyor mu, ayakta kalıyor mu
    # kontrol edilir. EXIT 124 = timeout sunucuyu öldürdü = ayakta kaldı
    # (başarı). Env değişkeni yokken de boot güvenlidir: listings.ts lazy
    # init kullanır, /api/listings istek anında 503 fail-closed döner.
    - name: Server boot smoke test
      run: NODE_ENV=production PORT=3999 timeout 15 node dist/server.cjs || test $? -eq 124

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: vite-dist
        path: dist/
